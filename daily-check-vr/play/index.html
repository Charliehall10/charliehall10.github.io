<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d1116">
    <title>Daily Check VR</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1116; }
      #unity-canvas {
        position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
        display: block; background: #0d1116; outline: none; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
      }
      #loader {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; color: #ffb01f; font: 700 22px/1 system-ui, sans-serif; letter-spacing: 6px; background: #0d1116;
        
      }
      #bar { width: 220px; height: 14px; border-radius: 7px; background: #26303a; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #ffb01f; }
      #loader.error { color: #fff; font-size: 14px; letter-spacing: 0; padding: 24px; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader"><div>DAILY CHECK VR</div><div id="bar"><div id="fill"></div></div></div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loader = document.querySelector("#loader");
      const fill = document.querySelector("#fill");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Charlie Hall",
        productName: "Daily Check VR",
        productVersion: "1.0",
      }, (progress) => {
        fill.style.width = Math.round(progress * 100) + "%";
      }).then(() => {
        loader.remove();
        canvas.focus();
      }).catch((message) => {
        loader.className = "error";
        loader.textContent = message;
      });
      // Keep keyboard focus on the game so the keys move the driver, not the page.
      canvas.addEventListener("pointerdown", () => canvas.focus());
      // Right-drag looks around, so keep the browser menu out of the way.
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
  </body>
</html>
